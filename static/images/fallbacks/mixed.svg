<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mixedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="mixedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#mixedBg)"/>

  <!-- Decorative Rings -->
  <circle cx="300" cy="175" r="140" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="300" cy="175" r="110" fill="#ffffff" fill-opacity="0.7" filter="url(#mixedShadow)"/>

  <!-- Mixed Refuse & Sorting Dustbin Illustration -->
  <g transform="translate(300, 175)">
    <!-- Main Municipal Waste Container -->
    <g transform="translate(0, 5)">
      <!-- Bin Body -->
      <path d="M -45,-30 L -35,55 Q -34,65 -22,65 L 22,65 Q 34,65 35,55 L 45,-30 Z" fill="url(#binGrad)"/>

      <!-- Vertical Ribs -->
      <line x1="-20" y1="-20" x2="-15" y2="50" stroke="#94a3b8" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="0" y2="50" stroke="#94a3b8" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="20" y1="-20" x2="15" y2="50" stroke="#94a3b8" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>

      <!-- Bin Rim / Lid -->
      <rect x="-52" y="-36" width="104" height="12" rx="4" fill="#1e293b"/>
      <rect x="-16" y="-44" width="32" height="8" rx="3" fill="#334155"/>

      <!-- Mixed Recycling Segregation Arrows Badge -->
      <circle cx="0" cy="15" r="18" fill="#ffffff" opacity="0.95"/>
      <g transform="translate(0, 15) scale(0.6)" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0,-16 L 14,-16 L 10,-8"/>
        <path d="M 12,-4 L 18,12 L 10,14"/>
        <path d="M -2,14 L -16,4 L -8,0"/>
      </g>
    </g>

    <!-- Assorted Items Floating / Emerging -->
    <!-- Apple Core / Organic piece -->
    <g transform="translate(-50, -45) rotate(-25) scale(0.6)">
      <path d="M -15,-20 C -25,-10 -20,15 0,20 C 20,15 25,-10 15,-20 Z" fill="#10b981"/>
      <path d="M 0,-20 Q 3,-30 10,-32" stroke="#047857" stroke-width="3" fill="none"/>
    </g>

    <!-- Plastic Bottle piece -->
    <g transform="translate(45, -45) rotate(20) scale(0.6)">
      <rect x="-8" y="-20" width="16" height="40" rx="6" fill="#f59e0b"/>
      <rect x="-5" y="-26" width="10" height="6" rx="2" fill="#b45309"/>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#334155" fill-opacity="0.9"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MIXED WASTE</text>
  </g>
</svg>

