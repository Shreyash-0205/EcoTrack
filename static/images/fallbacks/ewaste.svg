<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ewasteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="ewasteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.14" flood-color="#3b0764"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#ewasteBg)"/>

  <!-- Decorative Rings -->
  <circle cx="300" cy="175" r="140" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="300" cy="175" r="110" fill="#ffffff" fill-opacity="0.65" filter="url(#ewasteShadow)"/>

  <!-- Circuit Traces Background Decoration -->
  <g stroke="#d8b4fe" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 200,140 L 230,140 L 250,160"/>
    <circle cx="200" cy="140" r="4" fill="#a855f7"/>
    <path d="M 370,140 L 400,140 L 415,125"/>
    <circle cx="415" cy="125" r="4" fill="#a855f7"/>
    <path d="M 210,210 L 240,210 L 250,200"/>
    <circle cx="210" cy="210" r="4" fill="#a855f7"/>
    <path d="M 370,210 L 390,210 L 405,225"/>
    <circle cx="405" cy="225" r="4" fill="#a855f7"/>
  </g>

  <!-- Electronic Microchip & Battery Illustration -->
  <g transform="translate(300, 175)">
    <!-- Battery in Background -->
    <g transform="translate(35, -45) rotate(18)">
      <rect x="0" y="8" width="30" height="65" rx="6" fill="url(#batteryGrad)"/>
      <rect x="8" y="0" width="14" height="8" rx="2" fill="#581c87"/>
      <!-- Lightning Bolt -->
      <polygon points="17,20 10,38 16,38 13,54 22,34 16,34" fill="#fef08a"/>
    </g>

    <!-- Main Silicon Microchip -->
    <g transform="translate(-45, -45)">
      <!-- External Chip Pins -->
      <!-- Top / Bottom Pins -->
      <g stroke="#581c87" stroke-width="4" stroke-linecap="round">
        <line x1="16" y1="-8" x2="16" y2="0"/>
        <line x1="32" y1="-8" x2="32" y2="0"/>
        <line x1="48" y1="-8" x2="48" y2="0"/>
        <line x1="64" y1="-8" x2="64" y2="0"/>
        <line x1="16" y1="80" x2="16" y2="88"/>
        <line x1="32" y1="80" x2="32" y2="88"/>
        <line x1="48" y1="80" x2="48" y2="88"/>
        <line x1="64" y1="80" x2="64" y2="88"/>
        <!-- Left / Right Pins -->
        <line x1="-8" y1="16" x2="0" y2="16"/>
        <line x1="-8" y1="32" x2="0" y2="32"/>
        <line x1="-8" y1="48" x2="0" y2="48"/>
        <line x1="-8" y1="64" x2="0" y2="64"/>
        <line x1="80" y1="16" x2="88" y2="16"/>
        <line x1="80" y1="32" x2="88" y2="32"/>
        <line x1="80" y1="48" x2="88" y2="48"/>
        <line x1="80" y1="64" x2="88" y2="64"/>
      </g>

      <!-- Central CPU Silicon Body -->
      <rect x="0" y="0" width="80" height="80" rx="12" fill="url(#chipGrad)"/>
      <rect x="14" y="14" width="52" height="52" rx="6" fill="#3b0764"/>

      <!-- Golden Core Die -->
      <rect x="25" y="25" width="30" height="30" rx="4" fill="#fbbf24"/>
      <circle cx="40" cy="40" r="7" fill="#d97706"/>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#6b21a8" fill-opacity="0.9"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ELECTRONIC WASTE</text>
  </g>
</svg>

