<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f8ee"/>
      <stop offset="100%" stop-color="#cbf0d7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#064e3b"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#wetBg)"/>

  <!-- Decorative Background Ring -->
  <circle cx="300" cy="180" r="140" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="300" cy="180" r="110" fill="#ffffff" fill-opacity="0.6" filter="url(#softShadow)"/>

  <!-- Organic Waste Illustration -->
  <g transform="translate(300, 175)">
    <!-- Compost Bowl / Bin Base -->
    <path d="M -75,20 C -70,75 70,75 75,20 Z" fill="#047857" opacity="0.9"/>
    <ellipse cx="0" cy="20" rx="75" ry="14" fill="#10b981"/>

    <!-- Apple Core / Fruit Silhouette -->
    <path d="M -22,-45 C -45,-30 -40,10 -20,18 C -10,22 10,22 20,18 C 40,10 45,-30 22,-45 C 10,-35 -10,-35 -22,-45 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M -16,-38 C -32,-25 -28,5 -14,12 C -6,15 6,15 14,12 C 28,5 32,-25 16,-38 C 7,-30 -7,-30 -16,-38 Z" fill="url(#appleGrad)"/>
    <path d="M 0,-45 Q 6,-62 16,-66" stroke="#065f46" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="-6" cy="-14" r="3" fill="#064e3b"/>
    <circle cx="6" cy="-8" r="3" fill="#064e3b"/>

    <!-- Sprouting Leaves -->
    <g transform="translate(14, -62) rotate(25)">
      <path d="M 0,0 C 18,-18 36,-10 40,6 C 36,22 18,18 0,0 Z" fill="url(#leafGrad)"/>
      <path d="M 0,0 Q 20,3 36,5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" fill="none"/>
    </g>

    <g transform="translate(-8, -48) rotate(-40)">
      <path d="M 0,0 C 14,-14 28,-8 30,5 C 28,16 14,14 0,0 Z" fill="#34d399"/>
    </g>
  </g>

  <!-- Category Tag & Subtitle -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#065f46" fill-opacity="0.88"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">WET &amp; ORGANIC</text>
  </g>
</svg>

