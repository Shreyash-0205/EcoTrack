<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.14" flood-color="#0c4a6e"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#dryBg)"/>

  <!-- Decorative Rings -->
  <circle cx="300" cy="175" r="140" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="300" cy="175" r="110" fill="#ffffff" fill-opacity="0.6" filter="url(#boxShadow)"/>

  <!-- Recyclable Dry Packaging / Cardboard & Paper Illustration -->
  <g transform="translate(300, 175)">
    <!-- Paper Sheet in background -->
    <g transform="translate(-50, -65) rotate(-12)">
      <rect x="0" y="0" width="55" height="75" rx="4" fill="#ffffff" opacity="0.95"/>
      <line x1="8" y1="15" x2="40" y2="15" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="28" x2="47" y2="28" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="41" x2="35" y2="41" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Isometric Recyclable Cardboard Box -->
    <g transform="translate(0, 10)">
      <!-- Left Face -->
      <polygon points="0,0 -60,-30 -60,40 0,70" fill="url(#boxFront)"/>
      <!-- Right Face -->
      <polygon points="0,0 60,-30 60,40 0,70" fill="#075985"/>
      <!-- Top Face -->
      <polygon points="0,0 -60,-30 0,-60 60,-30" fill="url(#boxTop)"/>

      <!-- Tape Line -->
      <polygon points="0,-60 10,-55 0,0 -10,-5" fill="#f0f9ff" opacity="0.6"/>

      <!-- Clean Recycling Symbol on Box Face -->
      <g transform="translate(-30, 20) scale(0.65)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0,-16 L 14,-16 L 10,-8"/>
        <path d="M 12,-4 L 18,12 L 10,14"/>
        <path d="M -2,14 L -16,4 L -8,0"/>
      </g>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#0369a1" fill-opacity="0.88"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DRY &amp; RECYCLABLE</text>
  </g>
</svg>

