<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="plasticBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="plasticShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.14" flood-color="#78350f"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#plasticBg)"/>

  <!-- Decorative Rings -->
  <circle cx="300" cy="175" r="140" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="300" cy="175" r="110" fill="#ffffff" fill-opacity="0.65" filter="url(#plasticShadow)"/>

  <!-- Plastic Bottles & Containers Illustration -->
  <g transform="translate(300, 175)">
    <!-- Food Container in Background -->
    <g transform="translate(15, -15)">
      <rect x="0" y="0" width="55" height="75" rx="10" fill="url(#cupGrad)" opacity="0.85"/>
      <rect x="-4" y="-8" width="63" height="10" rx="3" fill="#92400e"/>
      <line x1="8" y1="25" x2="47" y2="25" stroke="#fef3c7" stroke-width="2" opacity="0.6"/>
      <line x1="8" y1="45" x2="47" y2="45" stroke="#fef3c7" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Main PET Water Bottle -->
    <g transform="translate(-40, -65)">
      <!-- Bottle Cap -->
      <rect x="14" y="0" width="18" height="10" rx="2" fill="#78350f"/>
      <rect x="12" y="10" width="22" height="4" rx="1" fill="#92400e"/>

      <!-- Bottle Neck -->
      <path d="M 15,14 L 15,24 Q 0,38 0,55 L 0,130 Q 0,140 10,140 L 36,140 Q 46,140 46,130 L 46,55 Q 46,38 31,24 L 31,14 Z" fill="url(#bottleGrad)"/>

      <!-- Inner Liquid Highlight -->
      <path d="M 6,65 Q 23,60 40,65 L 40,128 Q 40,134 34,134 L 12,134 Q 6,134 6,128 Z" fill="#ffffff" opacity="0.3"/>

      <!-- Bottle Grip Grooves -->
      <line x1="8" y1="80" x2="38" y2="80" stroke="#78350f" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="8" y1="95" x2="38" y2="95" stroke="#78350f" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="8" y1="110" x2="38" y2="110" stroke="#78350f" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
    </g>

    <!-- Plastic Polymer Triangular Recycling Emblem -->
    <g transform="translate(-4, 15) scale(0.7)" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,-18 L 16,12 L -16,12 Z"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="900" fill="#78350f" stroke="none" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#b45309" fill-opacity="0.9"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PLASTIC STREAM</text>
  </g>
</svg>

