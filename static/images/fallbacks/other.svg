<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="otherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="otherShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#134e4a"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#otherBg)"/>

  <!-- Decorative Rings -->
  <circle cx="300" cy="175" r="140" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="300" cy="175" r="110" fill="#ffffff" fill-opacity="0.7" filter="url(#otherShadow)"/>

  <!-- Construction & Special Debris Illustration -->
  <g transform="translate(300, 175)">
    <!-- Base Masonry Block -->
    <g transform="translate(-45, 10)">
      <polygon points="0,0 60,0 80,-20 20,-20" fill="#2dd4bf"/>
      <polygon points="0,0 60,0 60,35 0,35" fill="url(#brickGrad)"/>
      <polygon points="60,0 80,-20 80,15 60,35" fill="#115e59"/>
    </g>

    <!-- Stacked Upper Block -->
    <g transform="translate(-15, -30)">
      <polygon points="0,0 55,0 75,-20 20,-20" fill="#5eead4"/>
      <polygon points="0,0 55,0 55,30 0,30" fill="url(#brickGrad)"/>
      <polygon points="55,0 75,-20 75,10 55,30" fill="#134e4a"/>
    </g>

    <!-- Hazard / Construction Badge -->
    <circle cx="-15" cy="-10" r="18" fill="#ffffff" opacity="0.95"/>
    <g transform="translate(-15, -10) scale(0.7)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,-16 L 16,14 L -16,14 Z"/>
      <line x1="0" y1="-4" x2="0" y2="4"/>
      <circle cx="0" cy="9" r="1" fill="#0f766e"/>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#0f766e" fill-opacity="0.9"/>
    <text x="0" y="5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">OTHER / DEBRIS</text>
  </g>
</svg>

