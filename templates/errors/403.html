{% extends 'base.html' %}

{% block title %}403 — Access Forbidden — EcoTrack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-modern p-5 bg-white shadow-sm">
                <div class="text-danger mb-3">
                    <i class="bi bi-shield-slash-fill" style="font-size: 4rem;"></i>
                </div>
                <h1 class="fw-bold mb-2">403</h1>
                <h4 class="fw-semibold mb-3">Access Denied</h4>
                <p class="text-muted mb-4">
                    You do not possess the required administrative authorizations to access this civic console or resource.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-house-door me-1"></i> Home
                    </a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary-eco">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Switch Account
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
