{% extends 'base.html' %}

{% block title %}400 — Bad Request — EcoTrack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-modern p-5 bg-white shadow-sm">
                <div class="text-warning mb-3">
                    <i class="bi bi-exclamation-triangle-fill" style="font-size: 4rem;"></i>
                </div>
                <h1 class="fw-bold mb-2">400</h1>
                <h4 class="fw-semibold mb-3">Bad Request</h4>
                <p class="text-muted mb-4">
                    The request could not be processed due to invalid syntax or an expired security token.
                </p>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary-eco">
                    <i class="bi bi-house-door me-1"></i> Return to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
