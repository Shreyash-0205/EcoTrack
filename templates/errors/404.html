{% extends 'base.html' %}

{% block title %}404 — Page Not Found — EcoTrack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-modern p-5 bg-white shadow-sm">
                <div class="text-success mb-3">
                    <i class="bi bi-geo-alt-fill" style="font-size: 4rem;"></i>
                </div>
                <h1 class="fw-bold mb-2">404</h1>
                <h4 class="fw-semibold mb-3">Page or Hotspot Not Found</h4>
                <p class="text-muted mb-4">
                    The requested page, report ID, or civic resource could not be found. It may have been relocated or removed.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('main.map_view') }}" class="btn btn-primary-eco">
                        <i class="bi bi-map me-1"></i> View Live Map
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
